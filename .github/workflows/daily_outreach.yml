name: Daily Outreach Autopilot

on:
  schedule:
    # Corre automáticamente de lunes a domingo a las 14:00 UTC
    # Equivale a las 8:00 AM hora de Costa Rica / 10:00 AM EST en EE.UU.
    - cron: '0 14 * * *'
  workflow_dispatch: # Permite iniciar el proceso de forma manual desde la web de GitHub

jobs:
  run-autopilot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Inject Zoho Credentials
      run: |
        mkdir -p 09-CONFIG
        echo '{
          "EMAIL": "${{ secrets.ZOHO_EMAIL }}",
          "APP_PASSWORD": "${{ secrets.ZOHO_APP_PASSWORD }}"
        }' > 09-CONFIG/email_credentials.json

    - name: Run Autopilot Pipeline
      run: |
        echo "=== PASO 1: Leyendo Respuestas y Notificaciones de Rebote (IMAP) ==="
        python 05-SCRIPTS/Gmail_API/read_replies.py
        
        echo "=== COMPROBACIÓN: Evaluando lote pendiente para Scraping ==="
        python -c "
        import glob, csv, subprocess
        pending = False
        for f in glob.glob('02-PIPELINE/airbnb_pipeline*.csv'):
            with open(f, newline='', encoding='utf-8') as file:
                reader = csv.DictReader(file)
                if any(row.get('Status') == 'PENDING' for row in reader):
                    pending = True
                    break
        if not pending:
            print('[INFO] No hay correos PENDING en el lote actual. Iniciando auto_scraper...')
            subprocess.run(['python', '05-SCRIPTS/Scraper/auto_scraper.py'], check=True)
            print('[INFO] Ejecutando limpiador y creador de nuevo lote...')
            # Cambiamos cwd al directorio del script Cleaner para que no falle sus paths relativos
            subprocess.run(['python', 'clean_csv.py'], cwd='05-SCRIPTS/Cleaner', check=True)
        else:
            print('[INFO] El lote actual tiene correos PENDING. Saltando Scraping.')
        "
        
        echo "=== PASO 2: Procesando Seguimientos (Follow-ups) ==="
        python 05-SCRIPTS/Email/auto_followup.py
        
        echo "=== PASO 3: Enviando nuevos correos en frío (Max 30) ==="
        python 05-SCRIPTS/Email/send_pipeline.py

    - name: Cleanup Credentials
      run: rm -f 09-CONFIG/email_credentials.json

    - name: Commit and Push Database Updates
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add 03-MASTER_DATABASE/master_database.csv 02-PIPELINE/
        
        if ! git diff --cached --quiet; then
          git commit -m "auto: update database and outreach pipeline statuses [skip ci]"
          git push
        else
          echo "No database changes detected. Nothing to commit."
        fi
