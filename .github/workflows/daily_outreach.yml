name: Daily Outreach Autopilot

on:
  schedule:
    # Corre automáticamente de lunes a domingo a las 14:00 UTC
    # Equivale a las 8:00 AM hora de Costa Rica / 10:00 AM EST en EE.UU.
    - cron: '0 14 * * *'
  workflow_dispatch: # Permite iniciar el proceso de forma manual desde la web de GitHub

jobs:
  run-autopilot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Inject Zoho Credentials
      run: |
        mkdir -p 05-CONFIG
        echo '{
          "EMAIL": "${{ secrets.ZOHO_EMAIL }}",
          "APP_PASSWORD": "${{ secrets.ZOHO_APP_PASSWORD }}",
          "GMAIL_USER": "${{ secrets.GMAIL_USER }}",
          "GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}"
        }' > 05-CONFIG/email_credentials.json

    - name: Step 1 & 2 - Scraper and Follow-ups
      run: |
        echo "=== PASO 1: Leyendo Respuestas y Notificaciones de Rebote (IMAP) ==="
        python 03-SCRIPTS/Gmail_API/read_replies.py
        
        echo "=== COMPROBACIÓN: Evaluando lote pendiente para Scraping ==="
        python -c "
        import glob, csv, subprocess
        pending = False
        for f in glob.glob('01-PIPELINE/altus_pipeline*.csv'):
            with open(f, newline='', encoding='utf-8') as file:
                reader = csv.DictReader(file)
                if any(row.get('Status') == 'PENDING' for row in reader):
                    pending = True
                    break
        if not pending:
            print('[INFO] No hay correos PENDING en el lote actual. Iniciando auto_scraper...')
            subprocess.run(['python', '03-SCRIPTS/Scraper/auto_scraper.py'], check=True)
            print('[INFO] Ejecutando limpiador y creador de nuevo lote...')
            subprocess.run(['python', 'clean_csv.py'], cwd='03-SCRIPTS/Cleaner', check=True)
        else:
            print('[INFO] El lote actual tiene correos PENDING. Saltando Scraping.')
        "
        
        echo "=== PASO 2: Procesando Seguimientos (Follow-ups) ==="
        python 03-SCRIPTS/Email/auto_followup.py

    - name: Commit Scraped Batches and Master DB updates
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add 02-MASTER_DATABASE/master_database.csv 01-PIPELINE/
        if ! git diff --cached --quiet; then
          git commit -m "auto: save new pipeline batch and follow-up data [skip ci]"
          git pull --rebase origin main
          git push
        else
          echo "No database changes detected. Nothing to commit."
        fi

    - name: Step 3 - Cold Emails (LLM Icebreakers)
      run: |
        echo "=== PASO 3: Enviando nuevos correos en frío (Max 30) ==="
        python 03-SCRIPTS/Email/send_pipeline.py

    - name: Cleanup Credentials
      if: always()
      run: rm -f 05-CONFIG/email_credentials.json

    - name: Commit Final State
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add 02-MASTER_DATABASE/master_database.csv 01-PIPELINE/
        if ! git diff --cached --quiet; then
          git commit -m "auto: update database and outreach pipeline statuses [skip ci]"
          git pull --rebase origin main
          git push
        else
          echo "No database changes detected. Nothing to commit."
        fi

    - name: Sync Master DB to Vercel Postgres / Neon
      if: always()
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        if [ -n "$DATABASE_URL" ]; then
          echo "Syncing Master DB to Vercel Postgres / Neon..."
          cd crm-app && npm install && node migrate.js
        else
          echo "DATABASE_URL secret not set. Skipping Neon DB sync."
        fi
